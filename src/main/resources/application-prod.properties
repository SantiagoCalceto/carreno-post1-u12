# Perfil prod: PostgreSQL. Host, puerto y base se pueden pasar por separado (DB_HOST, DB_PORT,
# DB_NAME, como los entrega Render) o la URL JDBC completa en DATASOURCE_URL.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}}
spring.datasource.username=${DATASOURCE_USER:appuser}
# Sin default utilizable: la contrasena real SIEMPRE llega por variable de entorno
spring.datasource.password=${DATASOURCE_PASSWORD:}
# validate: Hibernate verifica el esquema y NO lo modifica. Solo en el primer despliegue sobre
# una base vacia se pasa JPA_DDL_AUTO=update para que cree la tabla.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.universidad=INFO
# (com.universidad=INFO deja visible la linea "The following 1 profile is active: prod")

# Actuator: en produccion solo health e info; los detalles de salud solo para usuarios autorizados
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
