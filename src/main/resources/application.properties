# Configuracion comun a todos los perfiles
spring.application.name=catalogo-productos
# Render/Railway inyectan PORT; en local se usa 8080
server.port=${PORT:8080}
# Sin variable de entorno arranca en dev (H2 en memoria); en produccion SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false

# Informacion publicada en /actuator/info (Parte 2)
management.info.env.enabled=true
info.app.nombre=Catalogo de Productos
info.app.descripcion=API REST del catalogo (Unidad 10) dockerizada con perfiles dev/prod
info.app.version=@project.version@
