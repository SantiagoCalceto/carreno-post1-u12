# H2 en memoria también para la ejecución local (ver decisión de diseño en el README):
# el objetivo de la unidad son las pruebas, no la persistencia contra un motor externo.
spring.datasource.url=jdbc:h2:mem:catalogo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea las tablas al arrancar y las elimina al detenerse
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web de H2 para inspeccionar los datos durante la ejecución local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
