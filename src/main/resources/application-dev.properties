# Perfil dev: H2 en memoria. Todos los valores tienen un default seguro para desarrollo,
# asi la aplicacion arranca sin configurar nada (local, pruebas y GitHub Actions).
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USER:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.com.universidad=DEBUG

# Actuator: en desarrollo se exponen todos los endpoints con todos los detalles
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
